<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credential Viewer</title>
    <style>
        :root {
            --bg: #f8f6f2;
            --panel: #ffffff;
            --line: #d9cfc1;
            --ink: #1d1b18;
            --muted: #5b544d;
            --accent: #183153;
            --accent-2: #007a6c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--ink);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .title {
            font-weight: 700;
            font-size: 0.96rem;
        }

        .actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 0.4rem 0.75rem;
            font-size: 0.86rem;
            color: var(--accent);
            background: var(--panel);
        }

        .btn.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .shell {
            max-width: 980px;
            margin: 1rem auto;
            padding: 0 0.8rem 1.2rem;
        }

        .hint {
            margin: 0 0 0.7rem;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .stage {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            min-height: 480px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(24, 49, 83, 0.08);
        }

        .status {
            padding: 1rem;
            color: var(--muted);
            border-bottom: 1px solid var(--line);
        }

        .canvas-wrap {
            overflow: auto;
            text-align: center;
            background: #ece8e1;
            min-height: 420px;
        }

        canvas {
            display: inline-block;
            margin: 1rem;
            background: #fff;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
            max-width: calc(100% - 2rem);
            height: auto;
        }

        .pager {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.7rem;
            border-top: 1px solid var(--line);
            padding: 0.65rem;
            background: #faf8f4;
        }

        .pager button {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--accent);
            border-radius: 8px;
            padding: 0.35rem 0.7rem;
            cursor: pointer;
            font-size: 0.86rem;
        }

        .pager button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .page-label {
            font-size: 0.88rem;
            color: var(--muted);
            min-width: 88px;
            text-align: center;
        }
    </style>
</head>

<body>
    <header class="top">
        <div class="title" id="docTitle">Credential Verification</div>
        <div class="actions">
            <a class="btn" id="openRaw" href="#" target="_blank" rel="noopener noreferrer">Open original PDF</a>
            <a class="btn" id="downloadRaw" href="#" download>Download PDF</a>
            <a class="btn primary" href="../index.html">Back to homepage</a>
        </div>
    </header>

    <main class="shell">
        <p class="hint">If your browser forces PDF downloads, this viewer renders pages directly without opening the
            Downloads folder.</p>
        <section class="stage">
            <div class="status" id="status">Loading document...</div>
            <div class="canvas-wrap">
                <canvas id="pdfCanvas"></canvas>
            </div>
            <div class="pager" id="pager" hidden>
                <button id="prevBtn" type="button">Previous</button>
                <span class="page-label" id="pageLabel">Page 1 / 1</span>
                <button id="nextBtn" type="button">Next</button>
            </div>
        </section>
    </main>

    <script type="module">
        import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.min.mjs";

        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.worker.min.mjs";

        const params = new URLSearchParams(window.location.search);
        const file = params.get("file");
        const title = params.get("title") || "Credential Verification";
        const requestedPage = Number.parseInt(params.get("page") || "1", 10);

        const docTitleEl = document.getElementById("docTitle");
        const statusEl = document.getElementById("status");
        const canvas = document.getElementById("pdfCanvas");
        const ctx = canvas.getContext("2d");
        const openRaw = document.getElementById("openRaw");
        const downloadRaw = document.getElementById("downloadRaw");
        const pager = document.getElementById("pager");
        const pageLabel = document.getElementById("pageLabel");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");

        docTitleEl.textContent = title;

        if (!file) {
            statusEl.textContent = "Missing PDF file path in URL. Please return to the homepage and reopen the link.";
            throw new Error("Missing file query parameter.");
        }

        const rawPageFragment = Number.isFinite(requestedPage) && requestedPage > 0 ? `#page=${requestedPage}` : "";
        openRaw.href = `${file}${rawPageFragment}`;
        downloadRaw.href = file;

        let pdfDoc = null;
        let currentPage = Number.isFinite(requestedPage) && requestedPage > 0 ? requestedPage : 1;
        let rendering = false;

        async function renderPage(pageNum) {
            if (!pdfDoc || rendering) {
                return;
            }
            rendering = true;
            statusEl.textContent = "Rendering page " + pageNum + "...";

            try {
                const page = await pdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.35 });
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                const renderContext = {
                    canvasContext: ctx,
                    viewport,
                };
                await page.render(renderContext).promise;

                pageLabel.textContent = "Page " + pageNum + " / " + pdfDoc.numPages;
                prevBtn.disabled = pageNum <= 1;
                nextBtn.disabled = pageNum >= pdfDoc.numPages;
                statusEl.textContent = "Loaded " + title + ".";
            } catch (err) {
                statusEl.textContent = "Could not render this PDF in-browser. Use Open original PDF or Download PDF.";
            } finally {
                rendering = false;
            }
        }

        prevBtn.addEventListener("click", () => {
            if (currentPage > 1) {
                currentPage -= 1;
                renderPage(currentPage);
            }
        });

        nextBtn.addEventListener("click", () => {
            if (pdfDoc && currentPage < pdfDoc.numPages) {
                currentPage += 1;
                renderPage(currentPage);
            }
        });

        try {
            const loadingTask = pdfjsLib.getDocument(file);
            pdfDoc = await loadingTask.promise;
            currentPage = Math.min(currentPage, pdfDoc.numPages);
            pager.hidden = false;
            await renderPage(currentPage);
        } catch (err) {
            statusEl.textContent = "Could not load this PDF in-browser. Use Open original PDF or Download PDF.";
            pager.hidden = true;
        }
    </script>
</body>

</html>
