<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Endless Dodger arcade game by Kyle Lin." />
  <title>Endless Dodger | Kyle Lin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f6f2;
      --ink: #13253a;
      --muted: #4f5b68;
      --line: #ccd5de;
      --panel: rgba(255, 255, 255, 0.84);
      --accent: #0e8d7a;
      --accent-2: #214f8f;
      --danger: #cc4735;
      --radius: 18px;
      --shadow: 0 16px 34px rgba(20, 34, 53, 0.14);
      --max: 960px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 8%, rgba(14, 141, 122, 0.22), transparent 34%),
        radial-gradient(circle at 84% 15%, rgba(33, 79, 143, 0.2), transparent 36%),
        linear-gradient(145deg, #fcfbf8 0%, #f2f5f8 46%, #edf4f2 100%);
      line-height: 1.45;
      padding: 1.2rem;
    }

    main {
      width: min(var(--max), 100%);
      margin: 0 auto;
      display: grid;
      gap: 0.9rem;
    }

    .back {
      justify-self: start;
      text-decoration: none;
      color: var(--accent-2);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
      padding: 0.44rem 0.78rem;
      border-radius: 999px;
      font-size: 0.9rem;
    }

    .hero,
    .game-shell {
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: clamp(1.1rem, 3vw, 1.8rem);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      border-radius: 999px;
      right: -65px;
      top: -85px;
      background: rgba(14, 141, 122, 0.15);
      pointer-events: none;
    }

    h1 {
      font-size: clamp(1.8rem, 4.4vw, 2.8rem);
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      position: relative;
      z-index: 1;
    }

    .subtitle {
      font-family: "IBM Plex Serif", Georgia, serif;
      color: #263544;
      max-width: 60ch;
      position: relative;
      z-index: 1;
    }

    .stats {
      margin-top: 0.85rem;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.6rem;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.88);
      padding: 0.56rem 0.7rem;
    }

    .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      display: block;
    }

    .value {
      font-size: 1.06rem;
      color: var(--accent-2);
      font-weight: 700;
    }

    .game-shell {
      padding: clamp(0.8rem, 2.7vw, 1.2rem);
      display: grid;
      gap: 0.9rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .hint {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .button {
      border: none;
      background: var(--accent-2);
      color: #fff;
      border-radius: 999px;
      padding: 0.52rem 0.86rem;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .arena {
      position: relative;
      width: min(460px, 100%);
      margin: 0 auto;
      height: clamp(360px, 66vh, 560px);
      border: 1px solid #9ab0c6;
      border-radius: 14px;
      overflow: hidden;
      touch-action: none;
      background:
        linear-gradient(180deg, rgba(210, 233, 248, 0.58), rgba(207, 227, 235, 0.22)),
        repeating-linear-gradient(90deg, rgba(24, 49, 83, 0.08) 0 2px, transparent 2px 46px);
    }

    .arena::before,
    .arena::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 8px;
      background: rgba(24, 49, 83, 0.14);
      z-index: 1;
      pointer-events: none;
    }

    .arena::before {
      left: 0;
    }

    .arena::after {
      right: 0;
    }

    .player {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(150deg, #0f8f7c, #1e5f96);
      box-shadow: 0 10px 16px rgba(15, 64, 98, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.66);
      z-index: 4;
    }

    .obstacle {
      position: absolute;
      border-radius: 10px;
      background: linear-gradient(150deg, #ef8d3f, #c24a39);
      box-shadow: 0 8px 14px rgba(140, 45, 37, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.44);
      z-index: 3;
    }

    .controls {
      width: min(460px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.55rem;
    }

    .control-btn {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      padding: 0.7rem 0.5rem;
      font-weight: 700;
      color: var(--accent-2);
      cursor: pointer;
      user-select: none;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .control-btn:active,
    .control-btn.active {
      transform: translateY(1px);
      background: #dbe8f6;
    }

    .message {
      text-align: center;
      min-height: 1.4rem;
      font-size: 0.92rem;
      color: var(--danger);
      font-weight: 700;
    }

    .message.ok {
      color: var(--accent);
    }

    @media (max-width: 640px) {
      body {
        padding: 0.85rem;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .hint {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main>
    <a class="back" href="../index.html">Back to games</a>

    <section class="hero">
      <h1>Endless Dodger</h1>
      <p class="subtitle">Survive as long as possible by dodging incoming blocks. Use left/right arrow keys (or A/D), or hold the touch controls on mobile.</p>
      <div class="stats">
        <div class="stat">
          <span class="label">Score</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="stat">
          <span class="label">Best</span>
          <span class="value" id="best">0</span>
        </div>
        <div class="stat">
          <span class="label">Speed</span>
          <span class="value" id="speed">1.0x</span>
        </div>
      </div>
    </section>

    <section class="game-shell">
      <div class="toolbar">
        <p class="hint">Avoid every obstacle. Difficulty continuously ramps up.</p>
        <button class="button" id="restart" type="button">Start / Restart</button>
      </div>

      <div class="arena" id="arena" aria-label="Endless Dodger game area">
        <div class="player" id="player" aria-hidden="true"></div>
      </div>

      <div class="controls" aria-label="Touch controls">
        <button class="control-btn" id="left-btn" type="button">Hold Left</button>
        <button class="control-btn" id="right-btn" type="button">Hold Right</button>
      </div>

      <p class="message" id="message">Press Start / Restart to begin.</p>
    </section>
  </main>

  <script>
    const BEST_KEY = "endlessDodgerBestV1";

    const arenaEl = document.getElementById("arena");
    const playerEl = document.getElementById("player");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const speedEl = document.getElementById("speed");
    const messageEl = document.getElementById("message");
    const restartBtn = document.getElementById("restart");
    const leftBtn = document.getElementById("left-btn");
    const rightBtn = document.getElementById("right-btn");

    let arenaWidth = 0;
    let arenaHeight = 0;

    const player = {
      x: 0,
      y: 0,
      width: 44,
      height: 44,
      speed: 330
    };

    let obstacles = [];
    let score = 0;
    let running = false;
    let animationId = null;
    let lastTimestamp = 0;
    let spawnTimer = 0;
    let inputLeft = false;
    let inputRight = false;

    function loadBest() {
      const raw = Number(localStorage.getItem(BEST_KEY));
      return Number.isFinite(raw) ? raw : 0;
    }

    function setMessage(text, ok = false) {
      messageEl.textContent = text;
      messageEl.classList.toggle("ok", ok);
    }

    function updateBest(scoreValue) {
      const best = loadBest();
      if (scoreValue > best) {
        localStorage.setItem(BEST_KEY, String(scoreValue));
        bestEl.textContent = String(scoreValue);
        return true;
      }
      bestEl.textContent = String(best);
      return false;
    }

    function resizeArena() {
      arenaWidth = arenaEl.clientWidth;
      arenaHeight = arenaEl.clientHeight;
      player.y = arenaHeight - player.height - 14;
      player.x = Math.max(10, Math.min(player.x, arenaWidth - player.width - 10));
      renderPlayer();
    }

    function renderPlayer() {
      playerEl.style.transform = `translate(${player.x}px, ${player.y}px)`;
    }

    function clearObstacles() {
      for (const obstacle of obstacles) {
        obstacle.el.remove();
      }
      obstacles = [];
    }

    function spawnObstacle() {
      const width = 38 + Math.random() * 46;
      const height = 18 + Math.random() * 20;
      const maxX = Math.max(12, arenaWidth - width - 12);
      const x = 8 + Math.random() * maxX;

      const obstacleEl = document.createElement("div");
      obstacleEl.className = "obstacle";
      obstacleEl.style.width = `${width}px`;
      obstacleEl.style.height = `${height}px`;
      arenaEl.appendChild(obstacleEl);

      obstacles.push({
        x,
        y: -height - 6,
        width,
        height,
        speed: 145 + score * 0.55 + Math.random() * 75,
        el: obstacleEl
      });
    }

    function intersects(a, b) {
      return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
    }

    function tick(timestamp) {
      if (!running) return;

      const elapsed = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
      lastTimestamp = timestamp;

      if (inputLeft && !inputRight) {
        player.x -= player.speed * elapsed;
      } else if (inputRight && !inputLeft) {
        player.x += player.speed * elapsed;
      }

      player.x = Math.max(8, Math.min(player.x, arenaWidth - player.width - 8));
      renderPlayer();

      score += elapsed * 11;
      const roundedScore = Math.floor(score);
      scoreEl.textContent = String(roundedScore);

      const speedScale = 1 + roundedScore / 95;
      speedEl.textContent = `${speedScale.toFixed(1)}x`;

      spawnTimer -= elapsed;
      const spawnInterval = Math.max(0.2, 0.82 - roundedScore * 0.0017);
      if (spawnTimer <= 0) {
        spawnObstacle();
        spawnTimer = spawnInterval;
      }

      for (let i = obstacles.length - 1; i >= 0; i -= 1) {
        const obstacle = obstacles[i];
        obstacle.y += obstacle.speed * elapsed;
        obstacle.el.style.transform = `translate(${obstacle.x}px, ${obstacle.y}px)`;

        if (intersects(player, obstacle)) {
          endGame();
          return;
        }

        if (obstacle.y > arenaHeight + obstacle.height + 10) {
          obstacle.el.remove();
          obstacles.splice(i, 1);
        }
      }

      animationId = window.requestAnimationFrame(tick);
    }

    function endGame() {
      running = false;
      if (animationId) {
        window.cancelAnimationFrame(animationId);
        animationId = null;
      }

      const roundedScore = Math.floor(score);
      const isRecord = updateBest(roundedScore);
      if (isRecord) {
        setMessage(`Crash at ${roundedScore}. New best!`, true);
      } else {
        setMessage(`Crash at ${roundedScore}. Try again to beat ${loadBest()}.`, false);
      }
    }

    function startGame() {
      resizeArena();
      clearObstacles();
      score = 0;
      scoreEl.textContent = "0";
      speedEl.textContent = "1.0x";
      player.x = (arenaWidth - player.width) / 2;
      renderPlayer();
      spawnTimer = 0.25;
      lastTimestamp = performance.now();
      running = true;
      setMessage("Game on. Dodge everything.", true);

      if (animationId) {
        window.cancelAnimationFrame(animationId);
      }
      animationId = window.requestAnimationFrame(tick);
    }

    function bindHoldButton(button, setFlag) {
      const activate = () => {
        setFlag(true);
        button.classList.add("active");
      };

      const deactivate = () => {
        setFlag(false);
        button.classList.remove("active");
      };

      button.addEventListener("pointerdown", activate);
      button.addEventListener("pointerup", deactivate);
      button.addEventListener("pointercancel", deactivate);
      button.addEventListener("pointerleave", deactivate);
      button.addEventListener("contextmenu", (event) => event.preventDefault());
    }

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") inputLeft = true;
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") inputRight = true;
    });

    window.addEventListener("keyup", (event) => {
      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") inputLeft = false;
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") inputRight = false;
    });

    window.addEventListener("blur", () => {
      inputLeft = false;
      inputRight = false;
      leftBtn.classList.remove("active");
      rightBtn.classList.remove("active");
    });

    window.addEventListener("resize", resizeArena);

    bindHoldButton(leftBtn, (value) => {
      inputLeft = value;
    });

    bindHoldButton(rightBtn, (value) => {
      inputRight = value;
    });

    restartBtn.addEventListener("click", startGame);

    bestEl.textContent = String(loadBest());
    resizeArena();
    renderPlayer();
  </script>
</body>

</html>
